name: TurkceOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Paketleri kur
        run: |
          sudo apt update
          sudo apt install -y build-essential git

      - name: Buildroot indir ve sistem kur
        run: |
          git clone https://github.com/buildroot/buildroot.git
          cd buildroot

          mkdir -p board/turkceos/rootfs-overlay/root

          echo 'import tkinter as tk
root = tk.Tk()
root.title("TürkçeOS")
root.attributes("-fullscreen", True)

def ac():
    w = tk.Toplevel(root)
    w.title("Not")
    tk.Text(w).pack()

tk.Button(root, text="Not Aç", command=ac).pack()
root.mainloop()' > board/turkceos/rootfs-overlay/root/desktop.py

          echo 'import tkinter as tk
import os

def baslat():
    os.system("python3 /root/desktop.py")

root = tk.Tk()
root.title("TürkçeOS")

tk.Button(root, text="Başlat", command=baslat).pack()
root.mainloop()' > board/turkceos/rootfs-overlay/root/installer.py

          echo 'python3 /root/installer.py' > board/turkceos/rootfs-overlay/root/.xinitrc

          cat > configs/turkceos_defconfig <<EOF
BR2_x86_64=y
BR2_TOOLCHAIN_BUILDROOT_GLIBC=y
BR2_TARGET_GENERIC_HOSTNAME="turkceos"
BR2_TARGET_GENERIC_ISSUE="TurkceOS"
BR2_PACKAGE_PYTHON3=y
BR2_PACKAGE_PYTHON3_TKINTER=y
BR2_PACKAGE_XORG7=y
BR2_PACKAGE_XINIT=y
BR2_TARGET_ROOTFS_ISO9660=y
BR2_ROOTFS_OVERLAY="board/turkceos/rootfs-overlay"
EOF

          make turkceos_defconfig
          make

      - name: ISO yükle
        uses: actions/upload-artifact@v3
        with:
          name: turkceos
          path: buildroot/output/images/
